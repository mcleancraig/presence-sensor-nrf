# Debug overlay: logs over a USB CDC ACM serial port (no USB-serial adapter needed).
# Keeps the USB peripheral and logging active - several hundred uA, do not deploy on battery.
# Usage: west build ... -- -DEXTRA_CONF_FILE=debug.conf -DEXTRA_DTC_OVERLAY_FILE=debug.overlay
# On macOS: screen /dev/cu.usbmodem* 115200
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_DEVICE_PRODUCT="Presence Sensor Debug"
CONFIG_USB_DEVICE_PID=0x0002
CONFIG_USB_DEVICE_LOG_LEVEL_OFF=y
CONFIG_USB_CDC_ACM_LOG_LEVEL_OFF=y
CONFIG_SERIAL=y
CONFIG_UART_LINE_CTRL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_APP_DEBUG_KEEP_ALIVE=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_LOG_BUFFER_SIZE=16384
CONFIG_CBPRINTF_FP_SUPPORT=y
