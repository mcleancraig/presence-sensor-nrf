# OpenThread SED + Home Assistant MQTT mmWave Presence Sensor (HLK-LD2410S) Configuration
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Hardware Peripherals
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_HWINFO=y

# Power Management (suspends uart0 UARTE0 between radar distance reads via pm_device_action_run;
# keep CONFIG_PM_DEVICE_RUNTIME=n so uarte_nrfx_isr_int does not call nrf_uarte_disable on RX IRQ)
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=n
CONFIG_POWEROFF=y

# Logging & console disabled in release builds for battery life.
# uart0 is used exclusively for HLK-LD2410S communication and is suspended
# via PM_DEVICE_ACTION_SUSPEND during idle sleep.
# For bring-up logs over USB CDC ACM, build with:
#   -DEXTRA_CONF_FILE=debug.conf -DEXTRA_DTC_OVERLAY_FILE=debug.overlay
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n

# System Stacks & Heap (sized for OpenThread SED + IPv6/TCP + MQTT)
CONFIG_MAIN_STACK_SIZE=6144
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384

# Flash, NVS & Bootloader Output (UF2 at 0x1000 for nice!nano v2 / SuperMini nRF52840)
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y

# OpenThread 1.3 Sleepy End Device (SED) + NAT64 + Home Assistant MQTT over IPv6/TCP
CONFIG_BT=n
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_COMMON=y
CONFIG_OPENTHREAD_THREAD_VERSION_1_3=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_POLL_PERIOD=5000
CONFIG_OPENTHREAD_DEFAULT_TX_POWER=8
CONFIG_OPENTHREAD_MANUAL_START=y
CONFIG_OPENTHREAD_DNS_CLIENT=y
CONFIG_OPENTHREAD_CUSTOM_PARAMETERS="OPENTHREAD_CONFIG_NAT64_CLIENT_ENABLE=1"

CONFIG_NET_IPV6=y
CONFIG_NET_IPV4=n
CONFIG_NET_IPV6_NBR_CACHE=n
CONFIG_NET_IPV6_MLD=n
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_MQTT_LIB=y
CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=32
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64

# Hardening & Diagnostics
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
