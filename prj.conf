# BTHome v2 BLE mmWave Presence Sensor (HLK-LD2410S) Configuration
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_REQUIRES_FULL_LIBCPP=y

# Hardware Peripherals
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_HWINFO=y

# Power Management (suspends uart0 UARTE0 between radar distance reads)
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_POWEROFF=y

# Logging & console disabled in release builds for battery life.
# uart0 is used exclusively for HLK-LD2410S communication and is suspended
# via PM_DEVICE_ACTION_SUSPEND during idle sleep.
# For bring-up logs over USB CDC ACM, build with:
#   -DEXTRA_CONF_FILE=debug.conf -DEXTRA_DTC_OVERLAY_FILE=debug.overlay
CONFIG_LOG=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=n

# System Stacks & Heap
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Flash & Bootloader Output (UF2 at 0x1000 for nice!nano v2 / SuperMini nRF52840)
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_BUILD_OUTPUT_UF2=y
CONFIG_BUILD_OUTPUT_HEX=y
CONFIG_USE_DT_CODE_PARTITION=y

# Bluetooth Low Energy (BTHome v2 Non-Connectable Broadcaster)
CONFIG_BT=y
CONFIG_BT_CTLR=y
CONFIG_BT_LL_SOFTDEVICE=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_EXT_ADV=n
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_DEVICE_NAME_MAX=16
CONFIG_BT_DEVICE_NAME="Presence"
CONFIG_BT_ID_MAX=2

# Hardening & Diagnostics
CONFIG_RESET_ON_FATAL_ERROR=y
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
