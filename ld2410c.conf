# Overlay configuration for Hi-Link HLK-LD2410C (5 V USB-C powered, 256000 baud, 16x22 mm)
#
# Build with:
#   west build --no-sysbuild -b nice_nano/nrf52840 -p always -- -DEXTRA_CONF_FILE="local.conf;ld2410c.conf"
#

CONFIG_APP_RADAR_LD2410C=y
CONFIG_APP_ALWAYS_USB_POWERED=y

# Always-on OpenThread Minimal End Device (MED: RxOnWhenIdle=true, zero sleepy parent-poll latency)
CONFIG_OPENTHREAD_MTD_SED=n

# 10 Hz (100 ms) real-time radar processing matching HLK-LD2410C native 10 Hz output rate
CONFIG_APP_RADAR_POLL_INTERVAL_MS=100

# Office geometry: 3.0 m max wall distance (0-indexed Gates 0..3 = 0.00..3.00 m), ~1.0 m seated desk position, 180 s (3 min) hold
CONFIG_APP_RADAR_MAX_GATE=3
CONFIG_APP_RADAR_MAX_DISTANCE_MM=2950
CONFIG_APP_RADAR_HOLD_S=180

# 180 s MQTT keepalive on always-powered Thread MED (tolerates transient 6LoWPAN/NAT64 jitter)
CONFIG_APP_MQTT_KEEPALIVE_SEC=180

# Enable flash write access for wireless MQTT FOTA self-update
CONFIG_MPU_ALLOW_FLASH_WRITE=y
